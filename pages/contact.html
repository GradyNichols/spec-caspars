<section class="max-w-7xl mx-auto px-4 py-16">
  <h1 class="text-4xl font-bold text-gray-900 mb-12 text-center">Contact Us</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
    <!-- Contact Information -->
    <div>
      <h2 class="text-2xl font-semibold text-gray-900 mb-6">Get In Touch</h2>

      <div class="mb-8">
        <h3 class="text-lg font-semibold text-gray-900 mb-3">📍 Address</h3>
        <p class="text-gray-600">
          123 Main Street<br />Downtown, City, ST 12345<br />USA
        </p>
      </div>

      <div class="mb-8">
        <h3 class="text-lg font-semibold text-gray-900 mb-3">📞 Phone</h3>
        <p class="text-gray-600">(555) 123-4567</p>
      </div>

      <div class="mb-8">
        <h3 class="text-lg font-semibold text-gray-900 mb-3">✉️ Email</h3>
        <p class="text-gray-600">info@ourrestaurant.com</p>
      </div>

      <div>
        <h3 class="text-lg font-semibold text-gray-900 mb-3">🕐 Hours</h3>
        <p class="text-gray-600">
          Monday - Thursday: 11:00 AM - 10:00 PM<br />
          Friday - Saturday: 11:00 AM - 11:00 PM<br />
          Sunday: 12:00 PM - 9:00 PM<br />
          <span class="font-semibold">Closed on Major Holidays</span>
        </p>
      </div>
    </div>

    <!-- Contact Form -->
    <div>
      <h2 class="text-2xl font-semibold text-gray-900 mb-6">
        Send us a Message
      </h2>
      <form id="contactForm" class="space-y-4">
        <div>
          <label
            for="contact-name"
            class="block text-gray-700 font-semibold mb-2"
            >Your Name</label
          >
          <input
            type="text"
            id="contact-name"
            name="name"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500"
          />
        </div>
        <div>
          <label
            for="contact-email"
            class="block text-gray-700 font-semibold mb-2"
            >Your Email</label
          >
          <input
            type="email"
            id="contact-email"
            name="email"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500"
          />
        </div>
        <div>
          <label
            for="contact-phone"
            class="block text-gray-700 font-semibold mb-2"
            >Phone Number</label
          >
          <input
            type="tel"
            id="contact-phone"
            name="phone"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500"
          />
        </div>
        <div>
          <label
            for="contact-subject"
            class="block text-gray-700 font-semibold mb-2"
            >Subject</label
          >
          <input
            type="text"
            id="contact-subject"
            name="subject"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500"
          />
        </div>
        <div>
          <label
            for="contact-message"
            class="block text-gray-700 font-semibold mb-2"
            >Message</label
          >
          <textarea
            id="contact-message"
            name="message"
            rows="5"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500"
          ></textarea>
        </div>
        <button
          type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition cursor-pointer"
        >
          Send Message
        </button>
      </form>
    </div>
  </div>
</section>
