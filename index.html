<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="bg-gray-900 text-white shadow-lg sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <!-- Left Navigation Links -->
          <div class="flex items-center space-x-8">
            <button
              onclick="loadPage('pages/home.html')"
              class="font-bold text-xl text-orange-500 cursor-pointer hover:opacity-80 transition"
            >
              Restaurant
            </button>
            <div class="hidden md:flex space-x-6">
              <button
                onclick="loadPage('pages/home.html')"
                class="hover:text-orange-500 transition cursor-pointer"
              >
                Home
              </button>
              <button
                onclick="loadPage('pages/menu.html')"
                class="hover:text-orange-500 transition cursor-pointer"
              >
                Menu
              </button>
              <button
                onclick="loadPage('pages/events.html')"
                class="hover:text-orange-500 transition cursor-pointer"
              >
                Events
              </button>
              <button
                onclick="loadPage('pages/contact.html')"
                class="hover:text-orange-500 transition cursor-pointer"
              >
                Contact
              </button>
            </div>
          </div>
          <!-- Right Navigation - Make a Reservation -->
          <button
            onclick="loadPage('pages/reservation.html')"
            class="bg-orange-500 hover:bg-orange-600 px-6 py-2 rounded transition cursor-pointer"
          >
            Make a Reservation
          </button>
        </div>
        <!-- Mobile Menu Toggle -->
        <div class="md:hidden flex justify-between items-center pb-4">
          <button
            onclick="toggleMobileMenu()"
            class="text-orange-500 text-2xl cursor-pointer"
          >
            ☰
          </button>
        </div>
        <!-- Mobile Navigation -->
        <div id="mobileMenu" class="hidden md:hidden pb-4">
          <button
            onclick="loadPage('pages/home.html')"
            class="block w-full text-left py-2 hover:text-orange-500 cursor-pointer"
          >
            Home
          </button>
          <button
            onclick="loadPage('pages/menu.html')"
            class="block w-full text-left py-2 hover:text-orange-500 cursor-pointer"
          >
            Menu
          </button>
          <button
            onclick="loadPage('pages/events.html')"
            class="block w-full text-left py-2 hover:text-orange-500 cursor-pointer"
          >
            Events
          </button>
          <button
            onclick="loadPage('pages/contact.html')"
            class="block w-full text-left py-2 hover:text-orange-500 cursor-pointer"
          >
            Contact
          </button>
        </div>
      </div>
    </nav>

    <div id="content" class="max-w-7xl mx-auto px-4 py-16"></div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-6 mt-12">
      <p>&copy; 2024 Our Restaurant. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
