<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caspar's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav
      id="navbar"
      class="text-white shadow-lg fixed top-0 left-0 right-0 z-50 transition-all duration-300"
      style="background-color: rgba(255, 255, 255, 0)"
    >
      <div
        class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 xl:px-10 md:py-2 lg:py-2"
      >
        <div class="flex justify-between items-center h-16">
          <!-- Logo and Desktop Navigation Links -->
          <div class="flex items-center space-x-8">
            <img
              src="logo/Caspars_no_logo_transparent.png"
              onclick="loadPage('pages/home.html')"
              alt="Caspar's Logo"
              class="logo cursor-pointer hover:opacity-80 transition primary-text w-auto h-auto"
              style="max-height: 60px"
            />
            <!-- <button
              onclick="loadPage('pages/home.html')"
              class="font-bold text-xl primary-text cursor-pointer hover:opacity-80 transition"
            >
              Restaurant
            </button> -->
            <div class="hidden md:block h-6 border-l border-gray-500"></div>
            <!-- Desktop Navigation Links -->
            <div class="nav-links hidden md:flex space-x-6">
              <button
                onclick="loadPage('pages/menu.html')"
                class="primary-hover-text transition cursor-pointer"
                id="menu-button"
              >
                Menu
              </button>
              <button
                onclick="loadPage('pages/events.html')"
                class="primary-hover-text transition cursor-pointer"
                id="events-button"
              >
                Events
              </button>
              <button
                onclick="loadPage('pages/contact.html')"
                class="primary-hover-text transition cursor-pointer"
                id="contact-button"
              >
                Contact
              </button>
            </div>
          </div>
          <!-- Right Navigation - Make a Reservation (hidden on mobile) -->
          <button
            onclick="loadPage('pages/reservation.html')"
            class="reservation-btn hidden md:block primary-bg primary-hover-bg px-6 py-2 rounded transition cursor-pointer text-white"
          >
            Make a Reservation
          </button>
          <!-- Mobile Menu Toggle -->
          <button
            onclick="toggleMobileMenu()"
            class="md:hidden primary-text text-2xl px-6 py-2 cursor-pointer"
          >
            ☰
          </button>
        </div>
        <!-- Mobile Navigation -->

        <div id="mobileMenu" class="navlinks md:hidden pb-4">
          <br />
          <button
            onclick="loadPage('pages/menu.html')"
            class="block w-full text-left py-2 primary-hover-text cursor-pointer"
            id="menu-button"
          >
            Menu
          </button>
          <button
            onclick="loadPage('pages/events.html')"
            class="block w-full text-left py-2 primary-hover-text cursor-pointer"
            id="events-button"
          >
            Events
          </button>
          <button
            onclick="loadPage('pages/contact.html')"
            class="block w-full text-left py-2 primary-hover-text cursor-pointer"
            id="contact-button"
          >
            Contact
          </button>
        </div>
      </div>
    </nav>

    <div id="content"></div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-6 mt-12">
      <p>&copy; 2026 Caspar's. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
