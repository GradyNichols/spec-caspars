<!-- =========================================
2. REQUIRED DATA ATTRIBUTES (ROLES)
========================================= -->

<!--
data-select          → container
data-trigger         → clickable button
data-dropdown        → dropdown container
data-option          → each selectable item
data-value           → stored value
data-value-display   → visible text
data-arrow           → arrow icon
-->

4. HOW TO USE
========================================= -->

<!--
✔ Duplicate the entire data-select block anywhere
✔ No ID changes needed
✔ JS works automatically for all instances
✔ Works across pages and dynamic loads

✔ Always call:
initCustomSelect()

after page load or content swap
-->

5. COMMON MISTAKES (AVOID THESE)
========================================= -->

❌ Using IDs for multiple dropdowns
❌ Using document.querySelectorAll globally for options
❌ Not wrapping in data-select container
❌ Forgetting to call initCustomSelect() after loading content
-->
