<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caspar's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav
      id="navbar"
      class="text-white shadow-lg fixed top-0 left-0 right-0 z-50 transition-all duration-100"
      style="background-color: rgba(255, 255, 255, 0)"
    >
      <div
        class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 xl:px-10 md:py-2 lg:py-2 transition-all duration-300"
      >
        <div class="flex justify-between items-center h-16">
          <!-- Logo and Desktop Navigation Links -->
          <div class="flex items-center space-x-8">
            <img
              src="logo/Caspars_no_logo_transparent.png"
              onclick="loadPage('pages/home.html')"
              alt="Caspar's Logo"
              class="logo cursor-pointer hover:opacity-80 transition primary-text w-auto h-auto"
              style="max-height: 60px"
            />
            <!-- <button
              onclick="loadPage('pages/home.html')"
              class="font-bold text-xl primary-text cursor-pointer hover:opacity-80 transition"
            >
              Restaurant
            </button> -->
            <div class="hidden md:block h-6 border-l border-gray-500"></div>
            <!-- Desktop Navigation Links -->
            <div class="nav-links hidden md:flex space-x-8">
              <button
                onclick="loadPage('pages/menu.html')"
                class="primary-hover-text transition cursor-pointer rounded-none"
                id="menu-button"
              >
                Menu
              </button>
              <button
                onclick="loadPage('pages/events.html')"
                class="primary-hover-text transition cursor-pointer rounded-none"
                id="events-button"
              >
                Events
              </button>
              <button
                onclick="loadPage('pages/contact.html')"
                class="primary-hover-text transition cursor-pointer rounded-none"
                id="contact-button"
              >
                Contact
              </button>
            </div>
          </div>
          <!-- Right Navigation - Make a Reservation (hidden on mobile) -->
          <button
            onclick="loadPage('pages/reservation.html')"
            class="reservation-btn hidden md:block primary-bg primary-hove r-bg px-8 py-2 rounded-sm transition cursor-pointer text-white"
          >
            Make a Reservation
          </button>
          <!-- Mobile Menu Toggle -->
          <button
            onclick="toggleMobileMenu()"
            class="md:hidden primary-text text-2xl px-6 py-2 cursor-pointer background-transparent border-none focus:outline-none"
          >
            ☰
          </button>
        </div>
        <!-- Mobile Navigation -->
        <!-- border-t-2 mt-2 for #mobileMenu -->
        <div id="mobileMenu" class="nav-links md:hidden pb-4 px-0">
          <br />
          <button
            onclick="loadPage('pages/menu.html')"
            class="primary-hover-text block w-full text-left py-2 px-4 primary-hover-text cursor-pointer rounded-sm transition"
            id="menu-button"
          >
            Menu
          </button>
          <button
            onclick="loadPage('pages/events.html')"
            class="primary-hover-text block w-full text-left py-2 px-4 primary-hover-text cursor-pointer rounded-sm transition"
            id="events-button"
          >
            Events
          </button>
          <button
            onclick="loadPage('pages/contact.html')"
            class="primary-hover-text block w-full text-left py-2 px-4 primary-hover-text cursor-pointer rounded-sm transition"
            id="contact-button"
          >
            Contact
          </button>
        </div>
      </div>
    </nav>

    <div id="content"></div>

    <!-- Footer -->
    <footer class="w-full bg-[#463D2E] text-gray-300 py-10 px-4 md:px-6">
      <div class="max-w-5xl mx-auto flex flex-wrap justify-between gap-6">
        <div
          class="flex flex-col items-center sm:items-start flex-1 min-w-[180px] sm:flex-[1_1_48%] md:flex-[1_1_22%]"
        >
          <h2 class="text-2xl font-semibold text-white mb-2">Caspar's</h2>
          <p class="text-gray-400 text-sm text-center sm:text-left">
            Luxury Persian Dining &sdot; Austin, TX
          </p>
        </div>

        <div
          class="flex flex-col items-center sm:items-start flex-1 min-w-[180px] sm:flex-[1_1_48%] md:flex-[1_1_22%]"
        >
          <h3 class="font-semibold text-white mb-2">Quick Links</h3>
          <ul class="space-y-1 text-gray-300 text-center sm:text-left">
            <li>
              <button
                class="primary-hover-text transition cursor-pointer rounded-none"
              >
                Privacy Policy
              </button>
            </li>
            <li>
              <button
                class="primary-hover-text transition cursor-pointer rounded-none"
              >
                Terms of Service
              </button>
            </li>
            <li>
              <button
                onclick="loadPage('pages/contact.html')"
                class="primary-hover-text transition cursor-pointer rounded-none"
              >
                Contact
              </button>
            </li>
          </ul>
        </div>

        <div
          class="flex flex-col items-center sm:items-start flex-1 min-w-[180px] sm:flex-[1_1_48%] md:flex-[1_1_22%]"
        >
          <h3 class="font-semibold text-white mb-2">Contact</h3>
          <p class="text-gray-400 text-sm">123 Main Street,</p>
          <p class="text-gray-400 text-sm">Austin, TX 78701</p>
          <p class="text-gray-400 text-sm">(512) 555-1234</p>
          <p class="text-gray-400 text-sm">
            <a
              href="#mailto:info@caspars.com"
              class="primary-hover-text transition"
            >
              info@caspars.com
            </a>
          </p>
        </div>

        <div
          class="flex flex-col items-center sm:items-start flex-1 min-w-[180px] sm:flex-[1_1_48%] md:flex-[1_1_22%]"
        >
          <h3 class="font-semibold text-white mb-2">Follow Us</h3>
          <div class="flex justify-center sm:justify-start space-x-4">
            <a href="#" class="primary-hover-text transition"> Facebook </a>
            <a href="#" class="primary-hover-text transition"> Instagram </a>
            <a href="#" class="primary-hover-text transition"> Twitter </a>
          </div>
        </div>
      </div>
      <div class="mt-8 md:mt-12 text-center text-gray-200 text-sm">
        &copy; 2026 Caspar's. All rights reserved.
      </div>
    </footer>
    <!-- <footer class="bg-gray-900 text-white text-center py-6 mt-12">


      <p>&copy; 2026 Caspar's. All rights reserved.</p>
    </footer> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
